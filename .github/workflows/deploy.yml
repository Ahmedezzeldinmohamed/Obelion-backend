name: Deploy Laravel Backend

on:
  push:
    branches:
      - "12.x" 

jobs:
  deploy:
    name: Deploy to EC2 Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          
          script: |
            echo "===== START DEPLOY ====="

            if ! [ -x "$(command -v docker)" ]; then
              sudo apt update -y
              sudo apt install -y docker.io docker-compose git
              sudo usermod -aG docker $USER
            fi

            # 🚨 التعديل الأول: استخدام git clone عبر SSH
            if [ ! -d "laravel-backend" ]; then
              # نستخدم git clone SSH لضمان عملها بشكل سليم مع المفتاح
              git clone git@github.com:${{ github.repository }} laravel-backend
              cd laravel-backend
            else
              cd laravel-backend
              echo "Cleaning up old data..."
              sudo rm -rf vendor bootstrap/cache
            fi

            # إعداد Git لاستخدام الـ SSH لعمليات الـ Pull اللاحقة
            git remote set-url origin git@github.com:${{ github.repository }}
            git fetch --all
            git checkout 12.x
            git pull origin 12.x

            echo "Creating .env file..."
            cat <<EOF > .env
APP_NAME=Laravel
APP_ENV=production
APP_KEY=
APP_DEBUG=false
APP_URL=http://${{ secrets.HOST_IP }}

DB_CONNECTION=mysql
DB_HOST=${{ secrets.RDS_HOST }}
DB_PORT=3306
DB_DATABASE=ecommerce_db
DB_USERNAME=${{ secrets.RDS_USER }}
DB_PASSWORD=${{ secrets.RDS_PASS }}
EOF

            chmod +x deploy.sh
            ./deploy.sh

            echo "===== DEPLOY FINISHED ====="
